<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上班辛苦了 ❤️</title><style>*{box-sizing:border-box}body{margin:0;background:#20172b;font-family:system-ui,'Noto Sans TC',sans-serif;color:white}.wrap{max-width:950px;margin:auto;min-height:100vh;background:linear-gradient(140deg,#65436c,#33223e 70%);padding:22px 18px 30px;text-align:center}.hero{position:relative;max-width:620px;margin:auto}.hero img{display:block;width:100%;max-height:490px;object-fit:contain;border-radius:24px;box-shadow:0 15px 40px #180d2780}h1{font-size:clamp(32px,7vw,55px);margin:18px 0 5px;color:#ffe4f1;text-shadow:2px 3px #b9467e}p{line-height:1.7}.subtitle{color:#ffe5ee}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px auto;max-width:760px}button{border:0;border-radius:19px;padding:19px 8px;color:white;font-weight:800;font-size:clamp(14px,3vw,20px);cursor:pointer;box-shadow:0 7px 0 #170e2440}button:disabled{opacity:.6;cursor:wait}.b1{background:#4d91f4}.b2{background:#f6a344}.b3{background:#f45e86}.response{min-height:75px;background:#ffffff19;border-radius:20px;padding:16px;max-width:650px;margin:10px auto;line-height:1.8}.sign{text-align:right;color:#ffc3db;font-size:21px;margin:25px 8px 0}.note{font-size:12px;color:#e5cddf}@media(max-width:480px){.choices{gap:7px}button{padding:14px 3px}.wrap{padding:14px 10px}}</style></head><body><main class="wrap"><h1>上班辛苦了！❤️</h1><p class="subtitle">今天也很努力了！不管現在多忙，你都已經很棒了 ✨</p><div class="hero"><img src="photo.png" alt="給你的一張加油照片"></div><h2>現在的你是什麼狀態呢？</h2><div class="choices"><button class="b1" onclick="vote('還在上班')">💻<br>還在上班</button><button class="b2" onclick="vote('準備下班')">☕<br>準備下班</button><button class="b3" onclick="vote('下班了')">🎉<br>下班了</button></div><div id="response" class="response" aria-live="polite">選一個狀態，我有話想跟你說 💕</div><p class="sign">融關心您～ ❤️</p></main><script>
// 部署後，把下方網址替換成你部署的 Google Apps Script 網頁應用程式網址
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwC_RmkQWsQQAsxmaoDo92jKf2wuVIa2LbWZBYJQWAqFVj9ZxpLAt_UwZTeWiAkaTw3ZA/exec';
const messages={'還在上班':'💪 辛苦了！再忙也要記得喝水、休息一下，你真的很棒 ❤️','準備下班':'☕ 快自由啦！再一下下，今天的辛苦都值得被好好犒賞 ✨','下班了':'🎉 恭喜下班！今天辛苦了，接下來要好好放鬆喔 💗'};
async function vote(choice){const el=document.getElementById('response');if(!SCRIPT_URL.startsWith('https://')){el.textContent='網站尚未設定回覆接收網址，請先完成 README 的設定。';return;}document.querySelectorAll('button').forEach(b=>b.disabled=true);el.textContent='正在送出你的回覆…';try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({choice})});el.textContent=messages[choice]+'（已送出，請以試算表確認紀錄）';}catch(e){el.textContent='送出時發生網路問題，請稍後再試。';}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
</script></body></html>
