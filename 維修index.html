<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf5ed">
  <meta name="description" content="融的小小關心所暫停開放，網站正在維護中。">
  <title>融努力維護中｜融的小小關心所</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf5ed;
      --ink: #30252a;
      --red: #d95c6b;
      --yellow: #ffd58d;
      --purple: #cdb9e9;
      --muted: #76636b;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{min-height:100%}
    body{
      margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);
      background:var(--paper);
      font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
      -webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;overflow-x:hidden;
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
      background-image:radial-gradient(#b8a6a4 0.6px,transparent 0.6px);
      background-size:19px 19px;z-index:0;
    }
    .topbar{position:relative;z-index:1;border-bottom:1px solid rgba(48,37,42,.16)}
    .topbar-inner{width:min(1100px,calc(100% - 44px));min-height:75px;margin:auto;
      display:flex;justify-content:space-between;gap:20px;align-items:center}
    .brand{font-size:15px;font-weight:900;letter-spacing:.05em;display:flex;align-items:center;gap:12px}
    .brand-symbol{height:38px;width:38px;border-radius:12px 9px 13px 10px;display:grid;place-items:center;
      background:var(--red);color:#fff;font-size:25px;transform:rotate(-10deg);box-shadow:3px 3px 0 var(--ink)}
    .status{font-size:11px;letter-spacing:.13em;font-weight:900;color:var(--muted);white-space:nowrap;display:flex;gap:9px;align-items:center}
    .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
    .ribbon{position:relative;z-index:1;background:var(--yellow);border-bottom:1.5px solid var(--ink);
      text-align:center;padding:9px 15px;font-size:11px;font-weight:900;letter-spacing:.2em}
    .ribbon span{padding:0 12px;color:#af4e5e}
    main{position:relative;z-index:1;flex:1;width:min(1100px,calc(100% - 44px));margin:auto;
      display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
      gap:clamp(34px,5vw,75px);align-items:center;padding:64px 0 83px}
    .copy{max-width:630px}
    .eyebrow{display:flex;align-items:center;gap:12px;font-weight:900;color:#9d5864;
      letter-spacing:.17em;font-size:11px}
    .eyebrow::before{content:"";width:36px;height:1.5px;background:var(--red)}
    h1{font-size:clamp(55px,7.3vw,104px);line-height:1.23;letter-spacing:-.09em;
      margin:25px 0 24px;font-weight:900}
    h1 .second{display:block;color:var(--red);position:relative;white-space:nowrap}
    h1 .star{display:inline-block;font-size:.57em;margin-left:10px;vertical-align:13%;color:#e6ae51;transform:rotate(-12deg);letter-spacing:0}
    .message{font-size:clamp(16px,1.7vw,19px);line-height:2.05;font-weight:650;color:#5c4b51;
      margin:0;max-width:510px;letter-spacing:.025em}
    .small-note{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--ink);
      background:#fff9f1;border-radius:99px;padding:12px 19px;font-size:12px;
      font-weight:850;margin-top:31px;box-shadow:4px 4px 0 var(--yellow)}
    .small-note b{font-size:16px;color:var(--red)}
    .visual{min-height:490px;display:grid;place-items:center;position:relative;isolation:isolate}
    .blob{position:absolute;width:min(99%,460px);aspect-ratio:1;transform:rotate(-17deg);
      background:var(--purple);border-radius:50% 48% 48% 52%/45% 60% 44% 58%;z-index:-1}
    .photo-frame{position:relative;background:#fffefb;padding:11px 11px 18px;
      width:min(86%,375px);margin:0;transform:rotate(5deg);
      box-shadow:0 22px 42px #60474835,8px 9px 0 var(--ink)}
    .photo-frame img{width:100%;aspect-ratio:412/416;object-fit:cover;display:block}
    .photo-frame figcaption{display:flex;align-items:center;justify-content:space-between;
      gap:10px;padding:15px 9px 0;font-size:11px;font-weight:900;letter-spacing:.055em}
    .photo-frame figcaption i{font-family:Georgia,serif;font-weight:700;font-size:20px;letter-spacing:-.04em}
    .tape{position:absolute;width:112px;height:35px;background:#f5dda8bf;top:-19px;
      left:50%;transform:translateX(-50%) rotate(-7deg);clip-path:polygon(2% 0,100% 5%,97% 100%,0 94%)}
    .stamp{position:absolute;right:0;top:30px;width:111px;height:111px;border-radius:50%;
      background:var(--red);border:2px solid var(--ink);color:#fff;box-shadow:5px 5px 0 var(--ink);
      display:grid;place-content:center;text-align:center;font-size:16px;line-height:1.4;font-weight:900;
      transform:rotate(13deg)}
    .stamp small{font-size:9px;letter-spacing:.17em;margin-bottom:5px}
    .doodle{position:absolute;bottom:3px;left:0;font-size:77px;color:var(--red);transform:rotate(-20deg);
      line-height:1;text-shadow:3px 4px 0 var(--ink);pointer-events:none}
    footer{position:relative;z-index:1;border-top:1px solid rgba(48,37,42,.16)}
    .footer-inner{width:min(1100px,calc(100% - 44px));margin:auto;padding:19px 0 24px;
      display:flex;justify-content:space-between;gap:15px;font-weight:800;font-size:11px;
      color:var(--muted);letter-spacing:.07em}
    .footer-inner strong{color:var(--red);font-size:13px}
    @media(max-width:850px){
      main{grid-template-columns:1fr;gap:30px;padding:60px 0 56px}
      .copy{max-width:720px;margin:0 auto;text-align:center}
      .eyebrow{justify-content:center}
      .message{margin-inline:auto}
      .visual{width:min(100%,430px);min-height:430px;margin:auto}
    }
    @media(max-width:520px){
      .topbar-inner{min-height:67px}.brand{font-size:12px;gap:8px}.brand-symbol{width:34px;height:34px;font-size:21px}
      .status{font-size:9px;letter-spacing:.04em}.ribbon{font-size:10px;letter-spacing:.06em}
      main{padding-top:44px;gap:24px}
      h1{font-size:clamp(53px,12.6vw,76px);margin:22px 0 17px}
      h1 .star{margin-left:3px;font-size:.46em}
      .message{font-size:15px;line-height:1.95}
      .small-note{margin-top:24px;font-size:11px}
      .visual{min-height:340px}.photo-frame{width:min(78%,295px)}
      .stamp{width:83px;height:83px;top:15px;right:0;font-size:12px}
      .stamp small{font-size:7px}.doodle{font-size:60px;left:9px;bottom:0}
      .photo-frame figcaption{font-size:9px;padding:11px 4px 0}.photo-frame figcaption i{font-size:16px}
      .footer-inner{font-size:10px;align-items:center}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
